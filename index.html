<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DFN Stock Tracker</title>
<style>
:root { color-scheme: light; --bg:#f6f8fa; --card:#fff; --border:#d0d7de; --fg:#1f2328; --muted:#656d76; --primary:#0969da; --warn-bg:rgba(212,167,44,0.12); --crit-bg:rgba(203,36,49,0.14); --up:#1a7f37; --down:#cf222e; }
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin:0; padding:16px; background:var(--bg); color:var(--fg); }
.header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap; }
h1 { margin:0; font-size:18px; }
.subtitle { color:var(--muted); font-size:12px; margin-bottom:14px; }
.btn { padding:7px 14px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--fg); font-size:13px; cursor:pointer; font-weight:500; }
.btn:hover { background:var(--bg); }
.btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
.btn.primary:hover { background:#0860ca; }
.btn:disabled { opacity:0.6; cursor:wait; }
.cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px; margin-bottom:16px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:12px; }
.card .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px; }
.card .value { font-size:20px; font-weight:600; margin-top:3px; }
.card .delta { font-size:11px; color:var(--muted); margin-top:3px; }
.delta.up { color:var(--up); } .delta.down { color:var(--down); }
.tabs { display:flex; gap:2px; margin-bottom:10px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.tab { padding:8px 14px; cursor:pointer; border:none; background:none; color:var(--fg); font-size:13px; border-bottom:2px solid transparent; }
.tab.active { border-bottom-color:var(--primary); font-weight:600; }
.tab .badge { background:var(--down); color:#fff; border-radius:10px; padding:1px 7px; font-size:10px; margin-left:4px; font-weight:600; }
.toolbar { display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
.toolbar input, .toolbar select { padding:6px 10px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--fg); font-size:13px; }
.table-wrap { background:var(--card); border:1px solid var(--border); border-radius:8px; overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th, td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
th { background:var(--bg); font-weight:600; cursor:pointer; user-select:none; position:sticky; top:0; z-index:1; }
td.sku-code { text-align:left; font-family:ui-monospace, monospace; font-size:11px; font-weight:600; color:var(--primary); }
td.imei { text-align:left; font-family:ui-monospace, monospace; font-size:11px; font-weight:600; color:var(--primary); }
td.desc { text-align:left; max-width:280px; overflow:hidden; text-overflow:ellipsis; }
td.class-col { text-align:left; color:var(--muted); font-size:11px; }
td.location { text-align:left; font-family:ui-monospace, monospace; font-size:11px; }
tr.group-header td { background:#f0f4f8; font-weight:600; cursor:pointer; user-select:none; }
tr.group-header td:first-child { text-align:left; }
tr.group-header td:not(:first-child) { text-align:right; }
tr.group-header:hover td { background:#e4ebf2; }
tr.warn { background:var(--warn-bg); } tr.crit { background:var(--crit-bg); }
.status-pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; }
.status-quarantine { background:#fff8c5; color:#7d4e00; }
.status-damaged { background:#ffebe9; color:#82071e; }
.status-second { background:#ddf4ff; color:#0969da; }
.status-unknown { background:#eaeef2; color:#656d76; }
.delta-up { color:var(--up); font-weight:600; } .delta-down { color:var(--down); font-weight:600; } .delta-none { color:var(--muted); }
.pill { display:inline-block; padding:1px 6px; border-radius:10px; font-size:9px; margin-left:4px; vertical-align:middle; }
.pill.crit { background:var(--down); color:#fff; }
.pill.warn { background:#d4a72c; color:#000; }
.chev { display:inline-block; width:10px; margin-right:4px; transition:transform 0.15s; }
.chev.open { transform:rotate(90deg); }
#refresh-status { font-size:11px; color:var(--muted); margin-left:8px; }
.site-flag { display:inline-block; padding:1px 6px; border-radius:4px; font-size:10px; font-weight:600; }
.site-IT { background:#e6f3e6; color:#1a7f37; }
.site-NL { background:#fff4e5; color:#9a3412; }
.subtabs { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.subtab { padding:6px 12px; border:none; background:var(--card); color:var(--fg); font-size:12px; cursor:pointer; }
.subtab + .subtab { border-left:1px solid var(--border); }
.subtab.active { background:var(--primary); color:#fff; font-weight:600; }
.age-pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; }
.age-60 { background:var(--warn-bg); } .age-90 { background:var(--crit-bg); color:var(--down); }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>DFN Stock Tracker</h1>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <div>
    <span id="refresh-status" style="font-size:11px; color:var(--muted);">Auto-updated weekdays 09:30 Helsinki</span>
  </div>
</div>

<div class="cards" id="summary"></div>

<div class="tabs" id="tabs">
  <button class="tab active" data-tab="all">Overview (both sites)</button>
  <button class="tab" data-tab="it">🇮🇹 Italy — Mora di Liscate</button>
  <button class="tab" data-tab="nl">🇳🇱 NL — Nijmegen</button>
  <button class="tab" data-tab="movement">📊 Movement & consumption</button>
  <button class="tab" data-tab="refill">💡 Refill plan</button>
  <button class="tab" data-tab="devices">📱 Available devices</button>
  <button class="tab" data-tab="recall">⚠ Devices to recall</button>
</div>

<div class="toolbar" id="toolbar-main">
  <input id="search" placeholder="Search SKU or description…" style="flex:1; max-width:360px;">
  <label><input type="checkbox" id="hidezero"> Hide zero-stock SKUs</label>
  <label><input type="checkbox" id="groupby" checked> Group by Product Class</label>
</div>

<div class="toolbar" id="toolbar-recall" style="display:none;">
  <input id="search-recall" placeholder="Search IMEI, model, location…" style="flex:1; max-width:360px;">
  <label>Site: <select id="recall-site"><option value="">All</option><option value="IT">Italy</option><option value="NL">NL</option></select></label>
  <label>Status: <select id="recall-status"><option value="">All</option></select></label>
  <label>Class: <select id="recall-class"><option value="">All</option></select></label>
</div>

<div class="toolbar" id="toolbar-refill" style="display:none;">
  <input id="search-refill" placeholder="Search SKU or description…" style="flex:1; max-width:300px;">
  <label>Site: <select id="refill-site"><option value="both">Both</option><option value="IT">Italy only</option><option value="NL">NL only</option></select></label>
  <label>Status: <select id="refill-status-filter">
    <option value="all">All SKUs with stock — default</option>
    <option value="action">Needs action (Critical + Warning)</option>
    <option value="critical">🔴 Critical only</option>
    <option value="warning">🟡 Warning only</option>
    <option value="ok">🟢 OK (sufficient cover)</option>
    <option value="dead">💀 Dead (no movement 30d)</option>
  </select></label>
  <label>Class: <select id="refill-class"><option value="">All</option></select></label>
</div>

<div class="toolbar" id="toolbar-devices" style="display:none;">
  <div class="subtabs" id="dev-view">
    <button class="subtab active" data-view="model">By model</button>
    <button class="subtab" data-view="aged" id="dev-view-aged">⏳ Over 60 days</button>
  </div>
  <input id="search-devices" placeholder="Search model…" style="flex:1; max-width:300px;">
  <label id="dev-age-wrap" style="display:none;">Age: <select id="dev-age"><option value="60">&gt; 60 days</option><option value="90">&gt; 90 days</option><option value="120">&gt; 120 days</option></select></label>
  <label id="dev-vat-wrap" style="display:none;">VAT: <select id="dev-vat"><option value="">All</option><option value="VAT">VAT</option><option value="mVAT">mVAT</option></select></label>
  <button class="btn" id="dev-copy" style="display:none;" title="Copy the IMEIs in the current list">Copy IMEIs</button>
  <label>Class: <select id="dev-class"><option value="">All</option></select></label>
  <label><input type="checkbox" id="dev-hidezero" checked> Hide zero-stock</label>
</div>

<div class="toolbar" id="toolbar-movement" style="display:none;">
  <input id="search-movement" placeholder="Search SKU or description…" style="flex:1; max-width:300px;">
  <label>Site: <select id="mov-site"><option value="both">Both</option><option value="IT">Italy only</option><option value="NL">NL only</option></select></label>
  <label>Filter: <select id="mov-filter">
    <option value="consumed">📉 Consumed (fast movers) — default</option>
    <option value="static">💤 Static (has stock, no consumption 7d)</option>
    <option value="dead">💀 Dead stock (no consumption 30d, has stock)</option>
    <option value="all">All SKUs with stock</option>
  </select></label>
  <label>Class: <select id="mov-class"><option value="">All</option></select></label>
</div>

<div class="table-wrap">
  <table id="table"><thead id="thead"></thead><tbody id="tbody"></tbody></table>
</div>

<script>
let DATA = JSON.parse(document.getElementById('data').textContent);
let currentTab = 'all', sortCol = 'it_total', sortDir = 'desc', collapsed = {};
let recallSort = 'status', recallDir = 'asc';
let movSort = 'it_7d_consumed', movDir = 'desc';  // desc so highest consumption on top
let devSort = 'total', devDir = 'desc';
let refillSort = 'it_refill_qty', refillDir = 'desc';

const subtitleEl = document.getElementById('subtitle');
const summaryEl = document.getElementById('summary');

const tbodyEl = document.getElementById('tbody');
const searchEl = document.getElementById('search');
const hidezeroEl = document.getElementById('hidezero');
const groupbyEl = document.getElementById('groupby');
const statusEl = document.getElementById('refresh-status');
const toolbarMain = document.getElementById('toolbar-main');
const toolbarRecall = document.getElementById('toolbar-recall');
const searchRecall = document.getElementById('search-recall');
const recallSite = document.getElementById('recall-site');
const recallStatus = document.getElementById('recall-status');
const recallClass = document.getElementById('recall-class');
const toolbarMovement = document.getElementById('toolbar-movement');
const searchMovement = document.getElementById('search-movement');
const movSiteSel = document.getElementById('mov-site');
const movFilterSel = document.getElementById('mov-filter');
const movClassSel = document.getElementById('mov-class');
const toolbarDevices = document.getElementById('toolbar-devices');
let devView = 'model', agedSort = 'age_days', agedDir = 'desc';
const devAgeSel = document.getElementById('dev-age'), devVatSel = document.getElementById('dev-vat'), devCopyBtn = document.getElementById('dev-copy');
const searchDevices = document.getElementById('search-devices');
const devClassSel = document.getElementById('dev-class');
const devHidezero = document.getElementById('dev-hidezero');
const toolbarRefill = document.getElementById('toolbar-refill');
const searchRefill = document.getElementById('search-refill');
const refillSite = document.getElementById('refill-site');
const refillStatusFilter = document.getElementById('refill-status-filter');
const refillClassSel = document.getElementById('refill-class');

function renderSubtitle() {
  const prevNote = DATA.has_prev ? ('vs prev ' + DATA.yesterday.snapshot_date) : 'no prior snapshot — delta will populate from next refresh';
  const mm = DATA.mov_meta || {};
  const win7 = mm.snap_7d_date ? `7d window: ${mm.snap_7d_date} (${mm.snap_7d_days_ago}d back)` : '7d window: n/a yet';
  const win30 = mm.snap_30d_date ? `30d window: ${mm.snap_30d_date} (${mm.snap_30d_days_ago}d back)` : '30d window: n/a yet';
  subtitleEl.textContent = `Snapshot ${DATA.today.snapshot_date} (${DATA.today.source_file}) · ${prevNote} · ${DATA.today.totals.sku_count} SKUs · ${(DATA.recall||[]).length} to recall · ${win7} · ${win30}`;
}

function renderSummary() {
  const t = DATA.today.totals, y = DATA.has_prev ? DATA.yesterday.totals : null;
  function card(label, value, prev) {
    const delta = (prev != null && DATA.has_prev) ? value - prev : null;
    const cls = delta == null ? '' : (delta > 0 ? 'up' : (delta < 0 ? 'down' : ''));
    const txt = delta == null ? '' : (delta > 0 ? '+' : '') + delta.toLocaleString();
    return `<div class="card"><div class="label">${label}</div><div class="value">${value.toLocaleString()}</div>${delta != null ? `<div class="delta ${cls}">${txt} vs prev</div>` : '<div class="delta">—</div>'}</div>`;
  }
  // Devices by class card (IT only — NL has 0 devices currently)
  const devs = DATA.available_devices || [];
  const byClass = {};
  let vatCount = 0, mVatCount = 0;
  for (const r of devs) {
    byClass[r.product_class] = (byClass[r.product_class] || 0) + (r.it_available || 0);
    if (r.vat_type === 'VAT') vatCount += (r.it_available || 0);
    else if (r.vat_type === 'mVAT') mVatCount += (r.it_available || 0);
  }
  const totalDevIT = Object.values(byClass).reduce((a,b) => a+b, 0);
  const classShort = {'Smartphone - Apple':'📱 Phones', 'Tablet - Apple':'📲 Tablets', 'Headphone - Apple':'🎧 Headphones'};
  const breakdown = Object.entries(byClass)
    .filter(([_,v]) => v > 0)
    .sort((a,b) => b[1]-a[1])
    .map(([k,v]) => `${classShort[k] || k}: ${v}`)
    .join(' · ');
  const vatPct = totalDevIT ? Math.round(vatCount/totalDevIT*100) : 0;
  const mVatPct = totalDevIT ? Math.round(mVatCount/totalDevIT*100) : 0;
  const vatLine = (vatCount + mVatCount > 0) ? `<div class="delta" style="font-size:10px; line-height:1.4;">VAT: ${vatCount} (${vatPct}%) · mVAT: ${mVatCount} (${mVatPct}%)</div>` : '';
  const devCard = `<div class="card"><div class="label">IT Devices Available</div><div class="value">${totalDevIT.toLocaleString()}</div><div class="delta" style="font-size:10px; line-height:1.4;">${breakdown || '—'}</div>${vatLine}</div>`;

  summaryEl.innerHTML = [
    card('IT Available', t.it_available, y?.it_available),
    card('IT Total', t.it_total, y?.it_total),
    card('NL Available', t.nl_available, y?.nl_available),
    card('NL Total', t.nl_total, y?.nl_total),
    devCard,
  ].join('');
  const recallCount = (DATA.recall || []).length;
  const recallTab = document.querySelector('[data-tab="recall"]');
  recallTab.innerHTML = `⚠ Devices to recall${recallCount ? ` <span class="badge">${recallCount}</span>` : ''}`;
}

function colSpec() {
  if (currentTab === 'all') return [['sku','SKU','left'], ['desc','Description','left'], ['product_class','Class','left'], ['it_available','IT Avail','right'], ['it_total','IT Total','right'], ['it_delta','IT Δ','right'], ['nl_available','NL Avail','right'], ['nl_total','NL Total','right'], ['nl_delta','NL Δ','right']];
  if (currentTab === 'it') return [['sku','SKU','left'], ['desc','Description','left'], ['product_class','Class','left'], ['it_available','Available','right'], ['it_second','2nd Quality','right'], ['it_quarantine','Quarantine','right'], ['it_damaged','Damaged','right'], ['it_total','Total','right'], ['it_delta','Δ','right']];
  if (currentTab === 'nl') return [['sku','SKU','left'], ['desc','Description','left'], ['product_class','Class','left'], ['nl_available','Available','right'], ['nl_second','2nd Quality','right'], ['nl_quarantine','Quarantine','right'], ['nl_damaged','Damaged','right'], ['nl_total','Total','right'], ['nl_delta','Δ','right']];
  if (currentTab === 'movement') {
    const site = movSiteSel.value;
    const lbl7 = 'Consumed 7d';
    const lbl30 = 'Consumed 30d';
    const cols = [['sku','SKU','left'], ['desc','Description','left'], ['product_class','Class','left']];
    if (site === 'both' || site === 'IT') {
      cols.push(['it_now','IT Now','right'], ['it_7d_consumed',`IT ${lbl7}`,'right'], ['it_30d_consumed',`IT ${lbl30}`,'right']);
    }
    if (site === 'both' || site === 'NL') {
      cols.push(['nl_now','NL Now','right'], ['nl_7d_consumed',`NL ${lbl7}`,'right'], ['nl_30d_consumed',`NL ${lbl30}`,'right']);
    }
    cols.push(['status','Status','left']);
    return cols;
  }
  if (currentTab === 'devices' && devView === 'aged') {
    return [['imei','IMEI','left'], ['model','Model','left'], ['vat_type','VAT','left'], ['site','Site','left'], ['location','Location','left'], ['received_date','Received at DFN','left'], ['age_days','Days at DFN','right']];
  }
  if (currentTab === 'devices') {
    return [['model','Model','left'], ['product_class','Class','left'], ['it_available','IT Available','right'], ['nl_available','NL Available','right'], ['total','Total','right']];
  }
  if (currentTab === 'refill') {
    const site = refillSite.value;
    const cols = [['sku','SKU','left'], ['desc','Description','left'], ['product_class','Class','left']];
    if (site === 'both' || site === 'IT') {
      cols.push(['it_current','IT Stock','right'], ['it_avg_daily','IT Avg/day','right'], ['it_days_cover','IT Days cover','right'], ['it_status','IT Status','left'], ['it_refill_qty','IT Refill qty','right']);
    }
    if (site === 'both' || site === 'NL') {
      cols.push(['nl_current','NL Stock','right'], ['nl_avg_daily','NL Avg/day','right'], ['nl_days_cover','NL Days cover','right'], ['nl_status','NL Status','left'], ['nl_refill_qty','NL Refill qty','right']);
    }
    return cols;
  }
  return [['imei','IMEI','left'], ['model','Model','left'], ['product_class','Class','left'], ['site','Site','left'], ['status','Status','left'], ['location','Location','left'], ['days_in_status','Days in status','right'], ['first_seen_date','Since','left']];
}

function renderHeader() {
  const cols = colSpec();
  let activeSort, activeDir;
  if (currentTab === 'recall') { activeSort = recallSort; activeDir = recallDir; }
  else if (currentTab === 'movement') { activeSort = movSort; activeDir = movDir; }
  else if (currentTab === 'devices' && devView === 'aged') { activeSort = agedSort; activeDir = agedDir; }
  else if (currentTab === 'devices') { activeSort = devSort; activeDir = devDir; }
  else if (currentTab === 'refill') { activeSort = refillSort; activeDir = refillDir; }
  else { activeSort = sortCol; activeDir = sortDir; }
  theadEl.innerHTML = '<tr>' + cols.map(([k,label,align]) => {
    const arrow = activeSort === k ? (activeDir === 'asc' ? ' ▲' : ' ▼') : '';
    return `<th data-sort="${k}" style="text-align:${align}">${label}${arrow}</th>`;
  }).join('') + '</tr>';
  theadEl.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (currentTab === 'recall') {
      if (recallSort === k) recallDir = recallDir === 'asc' ? 'desc' : 'asc';
      else { recallSort = k; recallDir = 'asc'; }
    } else if (currentTab === 'movement') {
      if (movSort === k) movDir = movDir === 'asc' ? 'desc' : 'asc';
      else { movSort = k; movDir = ['sku','desc','product_class','status'].includes(k) ? 'asc' : 'asc'; }
    } else if (currentTab === 'devices' && devView === 'aged') {
      if (agedSort === k) agedDir = agedDir === 'asc' ? 'desc' : 'asc';
      else { agedSort = k; agedDir = k === 'age_days' ? 'desc' : 'asc'; }
    } else if (currentTab === 'devices') {
      if (devSort === k) devDir = devDir === 'asc' ? 'desc' : 'asc';
      else { devSort = k; devDir = ['model','product_class'].includes(k) ? 'asc' : 'desc'; }
    } else if (currentTab === 'refill') {
      if (refillSort === k) refillDir = refillDir === 'asc' ? 'desc' : 'asc';
      else { refillSort = k; refillDir = ['sku','desc','product_class','it_status','nl_status'].includes(k) ? 'asc' : 'desc'; }
    } else {
      if (sortCol === k) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortCol = k; sortDir = ['sku','desc','product_class'].includes(k) ? 'asc' : 'desc'; }
    }
    render();
  }));
}

function filterTabRows(rows) {
  if (currentTab === 'it') return rows.filter(r => r.it_total > 0 || r.it_total_prev > 0);
  if (currentTab === 'nl') return rows.filter(r => r.nl_total > 0 || r.nl_total_prev > 0);
  return rows;
}

function dCell(v) {
  if (v == null) return '<td class="delta-none">—</td>';
  if (v === 0) return '<td class="delta-none">0</td>';
  const cls = v > 0 ? 'delta-up' : 'delta-down';
  return `<td class="${cls}">${v > 0 ? '+' : ''}${v}</td>`;
}

function pill(cls) {
  return cls === 'crit' ? '<span class="pill crit">LOW</span>' : (cls === 'warn' ? '<span class="pill warn">WARN</span>' : '');
}

function rowHtml(r) {
  const itCls = r.it_available > 0 && r.it_available <= DATA.low_crit ? 'crit' : (r.it_available > 0 && r.it_available <= DATA.low_warn ? 'warn' : '');
  const nlCls = r.nl_available > 0 && r.nl_available <= DATA.low_crit ? 'crit' : (r.nl_available > 0 && r.nl_available <= DATA.low_warn ? 'warn' : '');
  const relevantCls = currentTab === 'nl' ? nlCls : currentTab === 'it' ? itCls : (itCls === 'crit' || nlCls === 'crit' ? 'crit' : (itCls === 'warn' || nlCls === 'warn' ? 'warn' : ''));
  const baseCols = `<td class="sku-code">${r.sku}</td><td class="desc" title="${r.desc}">${r.desc}</td><td class="class-col">${r.product_class}</td>`;
  if (currentTab === 'all') {
    return `<tr class="${relevantCls}">${baseCols}<td>${r.it_available}${pill(itCls)}</td><td>${r.it_total}</td>${dCell(r.it_delta)}<td>${r.nl_available}${pill(nlCls)}</td><td>${r.nl_total}</td>${dCell(r.nl_delta)}</tr>`;
  } else if (currentTab === 'it') {
    return `<tr class="${relevantCls}">${baseCols}<td>${r.it_available}${pill(itCls)}</td><td>${r.it_second}</td><td>${r.it_quarantine}</td><td>${r.it_damaged}</td><td>${r.it_total}</td>${dCell(r.it_delta)}</tr>`;
  } else {
    return `<tr class="${relevantCls}">${baseCols}<td>${r.nl_available}${pill(nlCls)}</td><td>${r.nl_second}</td><td>${r.nl_quarantine}</td><td>${r.nl_damaged}</td><td>${r.nl_total}</td>${dCell(r.nl_delta)}</tr>`;
  }
}

function statusClass(s) {
  const map = {'Quarantine':'status-quarantine','Damaged':'status-damaged','Second Quality':'status-second','Unknown':'status-unknown'};
  return map[s] || 'status-unknown';
}

function recallRowHtml(r) {
  const days = r.days_in_status != null ? r.days_in_status : '—';
  const sinceDate = r.first_seen_date || '—';
  // Highlight long-standing devices in red
  const daysCls = (typeof r.days_in_status === 'number' && r.days_in_status >= 14) ? 'style="color:var(--down); font-weight:600;"' : '';
  return `<tr><td class="imei">${r.imei}</td><td class="desc">${r.model}</td><td class="class-col">${r.product_class}</td><td><span class="site-flag site-${r.site}">${r.site}</span></td><td><span class="status-pill ${statusClass(r.status)}">${r.status}</span></td><td class="location">${r.location || '—'}</td><td ${daysCls}>${days}</td><td class="class-col">${sinceDate}</td></tr>`;
}

function populateRecallFilters() {
  const statuses = [...new Set((DATA.recall||[]).map(r => r.status))].sort();
  const classes = [...new Set((DATA.recall||[]).map(r => r.product_class))].sort();
  const curS = recallStatus.value, curC = recallClass.value;
  recallStatus.innerHTML = '<option value="">All</option>' + statuses.map(s => `<option value="${s}" ${s===curS?'selected':''}>${s}</option>`).join('');
  recallClass.innerHTML = '<option value="">All</option>' + classes.map(s => `<option value="${s}" ${s===curC?'selected':''}>${s}</option>`).join('');
}

function renderRecall() {
  let rows = (DATA.recall || []).slice();
  const q = searchRecall.value.toLowerCase().trim();
  if (q) rows = rows.filter(r => r.imei.toLowerCase().includes(q) || (r.model||'').toLowerCase().includes(q) || (r.location||'').toLowerCase().includes(q));
  if (recallSite.value) rows = rows.filter(r => r.site === recallSite.value);
  if (recallStatus.value) rows = rows.filter(r => r.status === recallStatus.value);
  if (recallClass.value) rows = rows.filter(r => r.product_class === recallClass.value);
  rows.sort((a,b) => {
    const av = (a[recallSort]||'').toString(), bv = (b[recallSort]||'').toString();
    return recallDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
  });
  tbodyEl.innerHTML = rows.length ? rows.map(recallRowHtml).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:20px;">No devices to recall 🎉</td></tr>';
}

// Consumption = max(0, -delta). Inbound (positive delta) is ignored for consumption-focused view.
function consumption(delta) { return delta == null ? null : (delta < 0 ? -delta : 0); }

function movStatus(r) {
  const site = movSiteSel.value;
  const consider_it = site === 'both' || site === 'IT';
  const consider_nl = site === 'both' || site === 'NL';
  const has_stock = (consider_it && r.it_now > 0) || (consider_nl && r.nl_now > 0);
  if (!has_stock) return {key:'empty', label:'⚫ Empty', cls:'status-unknown'};
  const c7 = [consider_it ? r.it_7d_consumed : null, consider_nl ? r.nl_7d_consumed : null].filter(v => v != null);
  const c30 = [consider_it ? r.it_30d_consumed : null, consider_nl ? r.nl_30d_consumed : null].filter(v => v != null);
  const anyConsumed7 = c7.some(v => v > 0);
  const noConsumed7 = c7.length > 0 && c7.every(v => v === 0);
  const noConsumed30 = c30.length > 0 && c30.every(v => v === 0);
  if (anyConsumed7) return {key:'consumed', label:'📉 Consumed', cls:'status-quarantine'};
  if (noConsumed30) return {key:'dead', label:'💀 Dead', cls:'status-damaged'};
  if (noConsumed7) return {key:'static', label:'💤 Static', cls:'status-unknown'};
  return {key:'empty', label:'—', cls:'status-unknown'};
}

function populateMovementFilters() {
  const classes = [...new Set((DATA.movement_rows||[]).map(r => r.product_class))].sort();
  const cur = movClassSel.value;
  movClassSel.innerHTML = '<option value="">All</option>' + classes.map(s => `<option value="${s}" ${s===cur?'selected':''}>${s}</option>`).join('');
}

function dCellMov(v) {
  if (v == null) return '<td class="delta-none">—</td>';
  if (v === 0) return '<td class="delta-none">0</td>';
  const cls = v > 0 ? 'delta-up' : 'delta-down';
  return `<td class="${cls}">${v > 0 ? '+' : ''}${v}</td>`;
}

function consumedCell(v) {
  if (v == null) return '<td class="delta-none">—</td>';
  if (v === 0) return '<td class="delta-none">0</td>';
  return `<td class="delta-down">${v}</td>`;  // consumption shown in red/down color
}

function renderMovement() {
  let rows = (DATA.movement_rows || []).slice();
  // Compute consumption fields on each row
  rows = rows.map(r => ({
    ...r,
    // Gross outflow from the data (inbound does not cancel usage); fall back to net drop for old data
    it_7d_consumed: r.it_7d_consumed ?? consumption(r.it_7d_delta),
    nl_7d_consumed: r.nl_7d_consumed ?? consumption(r.nl_7d_delta),
    it_30d_consumed: r.it_30d_consumed ?? consumption(r.it_30d_delta),
    nl_30d_consumed: r.nl_30d_consumed ?? consumption(r.nl_30d_delta),
  }));
  const q = searchMovement.value.toLowerCase().trim();
  if (q) rows = rows.filter(r => r.sku.toLowerCase().includes(q) || (r.desc||'').toLowerCase().includes(q));
  if (movClassSel.value) rows = rows.filter(r => r.product_class === movClassSel.value);
  rows = rows.map(r => ({...r, _status: movStatus(r)}));
  const f = movFilterSel.value;
  if (f === 'consumed') rows = rows.filter(r => r._status.key === 'consumed');
  else if (f === 'static') rows = rows.filter(r => r._status.key === 'static');
  else if (f === 'dead') rows = rows.filter(r => r._status.key === 'dead');
  else rows = rows.filter(r => r._status.key !== 'empty');
  rows.sort((a,b) => {
    let av, bv;
    if (movSort === 'status') { av = a._status.key; bv = b._status.key; }
    else { av = a[movSort]; bv = b[movSort]; }
    if (av == null) av = movDir === 'asc' ? Infinity : -Infinity;
    if (bv == null) bv = movDir === 'asc' ? Infinity : -Infinity;
    if (typeof av === 'string') return movDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return movDir === 'asc' ? av - bv : bv - av;
  });
  const site = movSiteSel.value;
  const colCount = colSpec().length;
  tbodyEl.innerHTML = rows.length ? rows.map(r => {
    const baseCols = `<td class="sku-code">${r.sku}</td><td class="desc" title="${r.desc}">${r.desc}</td><td class="class-col">${r.product_class}</td>`;
    let siteCells = '';
    if (site === 'both' || site === 'IT') siteCells += `<td>${r.it_now}</td>${consumedCell(r.it_7d_consumed)}${consumedCell(r.it_30d_consumed)}`;
    if (site === 'both' || site === 'NL') siteCells += `<td>${r.nl_now}</td>${consumedCell(r.nl_7d_consumed)}${consumedCell(r.nl_30d_consumed)}`;
    return `<tr>${baseCols}${siteCells}<td><span class="status-pill ${r._status.cls}">${r._status.label}</span></td></tr>`;
  }).join('') : `<tr><td colspan="${colCount}" style="text-align:center;color:var(--muted);padding:20px;">No matches</td></tr>`;
}

function populateDevicesFilters() {
  const classes = [...new Set((DATA.available_devices||[]).map(r => r.product_class))].sort();
  const cur = devClassSel.value;
  devClassSel.innerHTML = '<option value="">All</option>' + classes.map(s => `<option value="${s}" ${s===cur?'selected':''}>${s}</option>`).join('');
}

let agedShown = [];
function renderAged() {
  const thr = +devAgeSel.value;
  let rows = (DATA.aged_devices || []).filter(r => r.age_days > thr);
  const q = searchDevices.value.toLowerCase().trim();
  if (q) rows = rows.filter(r => (r.imei+' '+r.model+' '+(r.location||'')).toLowerCase().includes(q));
  if (devClassSel.value) rows = rows.filter(r => r.product_class === devClassSel.value);
  if (devVatSel.value) rows = rows.filter(r => r.vat_type === devVatSel.value);
  rows.sort((a,b) => {
    let av = a[agedSort], bv = b[agedSort];
    if (typeof av === 'number' || typeof bv === 'number') return agedDir === 'asc' ? (av||0)-(bv||0) : (bv||0)-(av||0);
    av = (av||'').toString(); bv = (bv||'').toString();
    return agedDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
  });
  agedShown = rows;
  const vat = rows.filter(r=>r.vat_type==='VAT').length, mvat = rows.filter(r=>r.vat_type==='mVAT').length;
  const over90 = rows.filter(r=>r.age_days>90).length;
  const approx = rows.some(r=>r.age_source!=='asn');
  const note = `<tr><td colspan="7" style="text-align:left; background:var(--group-bg); font-weight:600;">${rows.length} available devices at DFN for more than ${thr} days · VAT ${vat} · mVAT ${mvat} · of which ${over90} over 90 days</td></tr>`
    + `<tr><td colspan="7" style="text-align:left; color:var(--muted); font-size:11px; white-space:normal;">Days at DFN = since receipt at DFN (ASN date from Lightdash where known${approx ? '; otherwise first day the IMEI appeared in the daily stock file, marked ~' : ''}). Candidates to recall before they age further.</td></tr>`;
  tbodyEl.innerHTML = note + (rows.length ? rows.map(r => {
    const cls = r.age_days > 90 ? 'age-90' : 'age-60';
    const approxMark = r.age_source === 'asn' ? '' : '~';
    return `<tr><td class="imei">${r.imei}</td><td class="desc">${r.model}</td><td class="class-col">${r.vat_type||'—'}</td><td><span class="site-flag site-${r.site}">${r.site}</span></td><td class="location">${r.location||'—'}</td><td class="class-col">${approxMark}${r.received_date}</td><td><span class="age-pill ${cls}">${approxMark}${r.age_days}</span></td></tr>`;
  }).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:20px;">No available devices over this age 🎉</td></tr>');
}

function renderDevices() {
  if (devView === 'aged') { renderAged(); return; }
  let rows = (DATA.available_devices || []).map(r => ({...r, total: (r.it_available||0) + (r.nl_available||0)}));
  const q = searchDevices.value.toLowerCase().trim();
  if (q) rows = rows.filter(r => (r.model||'').toLowerCase().includes(q));
  if (devClassSel.value) rows = rows.filter(r => r.product_class === devClassSel.value);
  if (devHidezero.checked) rows = rows.filter(r => r.total > 0);
  rows.sort((a,b) => {
    let av = a[devSort], bv = b[devSort];
    if (av == null) av = -Infinity; if (bv == null) bv = -Infinity;
    if (typeof av === 'string') return devDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return devDir === 'asc' ? av - bv : bv - av;
  });
  // Totals row
  const sumIT = rows.reduce((a,r)=>a+r.it_available,0);
  const sumNL = rows.reduce((a,r)=>a+r.nl_available,0);
  const sumTotal = sumIT + sumNL;
  const totalsRow = `<tr style="background:#f0f4f8; font-weight:600;"><td colspan="2" style="text-align:left;">TOTAL (${rows.length} models)</td><td>${sumIT}</td><td>${sumNL}</td><td>${sumTotal}</td></tr>`;
  tbodyEl.innerHTML = rows.length ? (totalsRow + rows.map(r => `<tr><td class="desc">${r.model}</td><td class="class-col">${r.product_class}</td><td>${r.it_available}</td><td>${r.nl_available}</td><td style="font-weight:600;">${r.total}</td></tr>`).join('')) : '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:20px;">No devices available</td></tr>';
}

function populateRefillFilters() {
  const classes = [...new Set((DATA.refill_rows||[]).map(r => r.product_class))].sort();
  const cur = refillClassSel.value;
  refillClassSel.innerHTML = '<option value="">All</option>' + classes.map(s => `<option value="${s}" ${s===cur?'selected':''}>${s}</option>`).join('');
}

function refillStatusPill(status) {
  const map = {
    'critical': {label:'🔴 Critical', cls:'status-damaged'},
    'warning': {label:'🟡 Warning', cls:'status-quarantine'},
    'ok': {label:'🟢 OK', cls:'status-second'},
    'dead': {label:'💀 Dead', cls:'status-damaged'},
    'static': {label:'💤 Static', cls:'status-unknown'},
    'empty': {label:'—', cls:'status-unknown'},
  };
  const s = map[status] || map['empty'];
  return `<span class="status-pill ${s.cls}">${s.label}</span>`;
}

function renderRefill() {
  const meta = DATA.refill_meta || {};
  // Banner about history maturity
  const banner = meta.history_mature
    ? ''
    : `<tr><td colspan="13" style="background:#fff8c5; color:#7d4e00; padding:10px; text-align:center;">⚠ History window: ${meta.window_days}d (target: 30d). Recommendations will become more accurate as data accumulates. Full-quality analysis available from Nov 11.</td></tr>`;
  let rows = (DATA.refill_rows || []).slice();
  const q = searchRefill.value.toLowerCase().trim();
  if (q) rows = rows.filter(r => r.sku.toLowerCase().includes(q) || (r.desc||'').toLowerCase().includes(q));
  if (refillClassSel.value) rows = rows.filter(r => r.product_class === refillClassSel.value);
  const site = refillSite.value;
  // Status filter: use "worst" of considered sites' statuses
  const statusRank = {critical: 4, warning: 3, ok: 2, static: 1, dead: 5, empty: 0};
  function rowStatusKey(r) {
    const statuses = [];
    if (site === 'both' || site === 'IT') statuses.push(r.it_status);
    if (site === 'both' || site === 'NL') statuses.push(r.nl_status);
    return statuses.sort((a,b) => (statusRank[b]||0) - (statusRank[a]||0))[0];
  }
  const f = refillStatusFilter.value;
  rows = rows.map(r => ({...r, _top_status: rowStatusKey(r)}));
  if (f === 'critical') rows = rows.filter(r => r._top_status === 'critical');
  else if (f === 'warning') rows = rows.filter(r => r._top_status === 'warning');
  else if (f === 'ok') rows = rows.filter(r => r._top_status === 'ok');
  else if (f === 'dead') rows = rows.filter(r => r._top_status === 'dead');
  else if (f === 'action') rows = rows.filter(r => r._top_status === 'critical' || r._top_status === 'warning');
  else rows = rows.filter(r => r._top_status !== 'empty');
  // Sort
  rows.sort((a,b) => {
    let av = a[refillSort], bv = b[refillSort];
    if (av == null) av = refillDir === 'asc' ? Infinity : -Infinity;
    if (bv == null) bv = refillDir === 'asc' ? Infinity : -Infinity;
    if (typeof av === 'string') return refillDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return refillDir === 'asc' ? av - bv : bv - av;
  });
  // Totals
  const totIT = rows.reduce((a,r)=>a+(r.it_refill_qty||0),0);
  const totNL = rows.reduce((a,r)=>a+(r.nl_refill_qty||0),0);
  const totalsCols = (site === 'both') ? 11 : 8;
  const totalRow = `<tr style="background:#f0f4f8; font-weight:600;"><td colspan="3" style="text-align:left;">TOTAL REFILL (${rows.length} SKUs)</td>` +
    ((site === 'both' || site === 'IT') ? `<td colspan="4"></td><td>${totIT.toLocaleString()}</td>` : '') +
    ((site === 'both' || site === 'NL') ? `<td colspan="4"></td><td>${totNL.toLocaleString()}</td>` : '') + '</tr>';
  const bodyRows = rows.map(r => {
    const baseCols = `<td class="sku-code">${r.sku}</td><td class="desc" title="${r.desc}">${r.desc}</td><td class="class-col">${r.product_class}</td>`;
    let siteCells = '';
    if (site === 'both' || site === 'IT') {
      siteCells += `<td>${r.it_current}</td><td>${r.it_avg_daily != null ? r.it_avg_daily : '—'}</td><td>${r.it_days_cover != null ? (r.it_days_cover > 365 ? '365+' : r.it_days_cover) : '—'}</td><td>${refillStatusPill(r.it_status)}</td><td style="font-weight:600;">${r.it_refill_qty > 0 ? r.it_refill_qty : '—'}</td>`;
    }
    if (site === 'both' || site === 'NL') {
      siteCells += `<td>${r.nl_current}</td><td>${r.nl_avg_daily != null ? r.nl_avg_daily : '—'}</td><td>${r.nl_days_cover != null ? (r.nl_days_cover > 365 ? '365+' : r.nl_days_cover) : '—'}</td><td>${refillStatusPill(r.nl_status)}</td><td style="font-weight:600;">${r.nl_refill_qty > 0 ? r.nl_refill_qty : '—'}</td>`;
    }
    return `<tr>${baseCols}${siteCells}</tr>`;
  }).join('');
  // Friendly empty-state message for action filter when stock is healthy
  let emptyMsg = 'No SKUs match filters';
  if (rows.length === 0 && f === 'action') {
    emptyMsg = '🎉 No critical or warning SKUs this week. All items have sufficient cover (>12 days). Switch filter to "All" or "OK" to see current state.';
  }
  tbodyEl.innerHTML = banner + (rows.length ? (totalRow + bodyRows) : `<tr><td colspan="13" style="text-align:center;color:var(--muted);padding:20px;">${emptyMsg}</td></tr>`);
}

function renderBody() {
  if (currentTab === 'recall') { renderRecall(); return; }
  if (currentTab === 'movement') { renderMovement(); return; }
  if (currentTab === 'refill') { renderRefill(); return; }
  if (currentTab === 'devices') { renderDevices(); return; }
  const q = searchEl.value.toLowerCase().trim();
  let rows = DATA.rows.slice();
  rows = filterTabRows(rows);
  if (q) rows = rows.filter(r => r.sku.toLowerCase().includes(q) || (r.desc||'').toLowerCase().includes(q) || (r.product_class||'').toLowerCase().includes(q));
  if (hidezeroEl.checked) {
    rows = rows.filter(r => currentTab === 'it' ? r.it_total > 0 : currentTab === 'nl' ? r.nl_total > 0 : (r.it_total + r.nl_total) > 0);
  }
  rows.sort((a,b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (av == null) av = -Infinity; if (bv == null) bv = -Infinity;
    if (typeof av === 'string') return sortDir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir === 'asc' ? av - bv : bv - av;
  });

  const colCount = colSpec().length;
  if (!groupbyEl.checked) {
    tbodyEl.innerHTML = rows.map(rowHtml).join('') || `<tr><td colspan="${colCount}" style="text-align:center;color:var(--muted);padding:20px;">No matches</td></tr>`;
    return;
  }

  const groups = {};
  for (const r of rows) {
    const g = r.product_class || '(uncategorized)';
    (groups[g] = groups[g] || []).push(r);
  }
  function sumDelta(grows, key) {
    if (!DATA.has_prev) return null;
    return grows.reduce((a,r) => a + (r[key] || 0), 0);
  }
  const html = Object.keys(groups).sort().map(g => {
    const grows = groups[g];
    const open = !collapsed[g];
    const chev = open ? 'open' : '';
    const sums = grows.reduce((acc, r) => {
      ['it_available','it_total','nl_available','nl_total','it_second','it_quarantine','it_damaged','nl_second','nl_quarantine','nl_damaged'].forEach(k => acc[k] = (acc[k]||0) + (r[k]||0));
      return acc;
    }, {});
    const itD = sumDelta(grows, 'it_delta'), nlD = sumDelta(grows, 'nl_delta');
    let sumCells;
    if (currentTab === 'all') sumCells = `<td></td><td></td><td>${sums.it_available}</td><td>${sums.it_total}</td>${dCell(itD)}<td>${sums.nl_available}</td><td>${sums.nl_total}</td>${dCell(nlD)}`;
    else if (currentTab === 'it') sumCells = `<td></td><td></td><td>${sums.it_available}</td><td>${sums.it_second}</td><td>${sums.it_quarantine}</td><td>${sums.it_damaged}</td><td>${sums.it_total}</td>${dCell(itD)}`;
    else sumCells = `<td></td><td></td><td>${sums.nl_available}</td><td>${sums.nl_second}</td><td>${sums.nl_quarantine}</td><td>${sums.nl_damaged}</td><td>${sums.nl_total}</td>${dCell(nlD)}`;
    return `<tr class="group-header" data-group="${g}"><td colspan="1"><span class="chev ${chev}">▶</span>${g} <span style="color:var(--muted); font-weight:400">(${grows.length} SKU${grows.length>1?'s':''})</span></td>${sumCells}</tr>${open ? grows.map(rowHtml).join('') : ''}`;
  }).join('');
  tbodyEl.innerHTML = html || `<tr><td colspan="${colCount}" style="text-align:center;color:var(--muted);padding:20px;">No matches</td></tr>`;
  tbodyEl.querySelectorAll('tr.group-header').forEach(tr => tr.addEventListener('click', () => {
    collapsed[tr.dataset.group] = !collapsed[tr.dataset.group];
    renderBody();
  }));
}

function render() { renderHeader(); renderBody(); }

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active'); currentTab = t.dataset.tab;
  toolbarMain.style.display = 'none'; toolbarRecall.style.display = 'none'; toolbarMovement.style.display = 'none'; toolbarDevices.style.display = 'none'; toolbarRefill.style.display = 'none';
  if (currentTab === 'recall') {
    toolbarRecall.style.display = 'flex'; populateRecallFilters();
  } else if (currentTab === 'movement') {
    toolbarMovement.style.display = 'flex'; populateMovementFilters();
  } else if (currentTab === 'refill') {
    toolbarRefill.style.display = 'flex'; populateRefillFilters();
  } else if (currentTab === 'devices') {
    toolbarDevices.style.display = 'flex'; populateDevicesFilters();
  } else {
    toolbarMain.style.display = 'flex';
    sortCol = currentTab === 'nl' ? 'nl_total' : 'it_total';
    sortDir = 'desc';
  }
  render();
}));
searchEl.addEventListener('input', renderBody);
hidezeroEl.addEventListener('change', renderBody);
groupbyEl.addEventListener('change', renderBody);
searchRecall.addEventListener('input', renderBody);
recallSite.addEventListener('change', renderBody);
recallStatus.addEventListener('change', renderBody);
recallClass.addEventListener('change', renderBody);
searchMovement.addEventListener('input', renderBody);
movSiteSel.addEventListener('change', () => render());
movFilterSel.addEventListener('change', renderBody);
movClassSel.addEventListener('change', renderBody);
searchDevices.addEventListener('input', renderBody);
devClassSel.addEventListener('change', renderBody);
devHidezero.addEventListener('change', renderBody);
searchRefill.addEventListener('input', renderBody);
refillSite.addEventListener('change', () => render());
refillStatusFilter.addEventListener('change', renderBody);
refillClassSel.addEventListener('change', renderBody);

function setDevView(v) {
  devView = v;
  document.querySelectorAll('#dev-view .subtab').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  const aged = v === 'aged';
  document.getElementById('dev-age-wrap').style.display = aged ? '' : 'none';
  document.getElementById('dev-vat-wrap').style.display = aged ? '' : 'none';
  devCopyBtn.style.display = aged ? '' : 'none';
  devHidezero.parentElement.style.display = aged ? 'none' : '';
  searchDevices.placeholder = aged ? 'Search IMEI, model, location…' : 'Search model…';
  render();
}
document.querySelectorAll('#dev-view .subtab').forEach(b => b.addEventListener('click', () => setDevView(b.dataset.view)));
devAgeSel.addEventListener('change', renderBody);
devVatSel.addEventListener('change', renderBody);
devCopyBtn.addEventListener('click', () => {
  const txt = agedShown.map(r => r.imei).join('\n');
  const done = () => { devCopyBtn.textContent = `Copied ${agedShown.length}`; setTimeout(() => devCopyBtn.textContent = 'Copy IMEIs', 1500); };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, done); else done();
});
(function(){ const n = (DATA.aged_devices||[]).length; const b = document.getElementById('dev-view-aged'); if (b) b.innerHTML = `⏳ Over 60 days${n ? ` <span class="badge">${n}</span>` : ''}`; })();

renderSubtitle(); renderSummary(); render();
</script>
</body>
</html>
